# ==========================================================
# Knpsih_clash
# ==========================================================

proxies:

proxy-providers:
  PP_ID:
    type: file
    path: "./proxy_provider/akun id.yaml"
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204
  PP_SG:
    type: file
    path: "./proxy_provider/akun sg.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://captive.apple.com
  PP_Cek:
    type: file
    path: "./proxy_provider/cek.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://captive.apple.com

rule-providers:
  RP_Block:
    type: file
    behavior: classical
    path: "./rule_provider/block.yaml"
  RP_Special:
    type: file
    behavior: classical
    path: "./rule_provider/special.yaml"
  RP_Game:
    type: file
    behavior: classical
    path: "./rule_provider/game.yaml"
  RP_Facebook:
    type: file
    behavior: classical
    path: "./rule_provider/facebook.yaml"
  RP_Tiktok:
    type: file
    behavior: classical
    path: "./rule_provider/tiktok.yaml"
  RP_Youtube:
    type: file
    behavior: classical
    path: "./rule_provider/youtube.yaml"
  RP_Instagram:
    type: file
    behavior: classical
    path: "./rule_provider/instagram.yaml"
  RP_Whatsapp:
    type: file
    behavior: classical
    path: "./rule_provider/whatsapp.yaml"
  RP_ID:
    type: file
    behavior: classical
    path: "./rule_provider/id.yaml"
  RP_NSFW:
    type: file
    behavior: classical
    path: "./rule_provider/nsfw.yaml"
  RP_Google:
    type: file
    behavior: classical
    path: "./rule_provider/google.yaml"
  RP_Umum:
    type: file
    behavior: classical
    path: "./rule_provider/umum.yaml"
    
proxy-groups:
- name: Ads
  type: select
  proxies:
  - REJECT
  - My Traffic
- name: Special
  type: fallback
  lazy: true
  use:
  - PP_ID
- name: Gaming
  type: fallback
  lazy: true
  proxies:
  - DIRECT
  use:
  - PP_ID
  - PP_SG
- name: SG
  type: select
  use:
  - PP_SG
- name: ID
  type: fallback
  lazy: true
  use:
  - PP_ID
- name: NFSW
  type: select
  use:
  - PP_SG
  proxies:
  - REJECT
  - My Traffic
- name: My Traffic
  type: fallback
  lazy: true
  use:
  - PP_SG
  - PP_ID
  
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,192.168.1.0/24,DIRECT,no-resolve
- IP-CIDR,192.168.16.0/24,DIRECT,no-resolve
- AND,((NETWORK,udp),(DST-PORT,443)),REJECT
- DOMAIN-KEYWORD,tailscale,My Traffic

- GEOSITE,category-ads-all,Ads
- RULE-SET,RP_Block,Ads

- RULE-SET,RP_NSFW,NFSW

- RULE-SET,RP_Game,Gaming

- RULE-SET,RP_Youtube,SG
- RULE-SET,RP_Tiktok,SG
- RULE-SET,RP_Facebook,SG

- RULE-SET,RP_Instagram,ID
- RULE-SET,RP_Whatsapp,ID
- RULE-SET,RP_ID,ID

- RULE-SET,RP_Google,SG

- RULE-SET,RP_Special,Special

- RULE-SET,RP_Umum,My Traffic
- MATCH,My Traffic